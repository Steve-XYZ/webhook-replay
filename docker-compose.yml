services:
  db:
    image: postgres:17
    container_name: webhook-replay-db
    environment:
      POSTGRES_DB: webhookreplay
      POSTGRES_USER: webhookreplay
      POSTGRES_PASSWORD: webhookreplay
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhookreplay -d webhookreplay"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./WebhookReplay.Api
    container_name: webhook-replay-api
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=webhookreplay;Username=webhookreplay;Password=webhookreplay
    ports:
      - "5000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      args:
        API_BASE: http://api:8080
    container_name: webhook-replay-ui
    environment:
      API_BASE: http://api:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
